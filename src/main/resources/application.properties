spring.application.name=Leave-Attendence-System

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.jsp.init-parameters.development=true

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/leave_attendance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Omgorle@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JSP Configuration - NOTE: Changed from /WEB-INF/views/ to /WEB-INF/jsp/
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/webapp/static/

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.leaveattendance=DEBUG
logging.level.org.hibernate=INFO